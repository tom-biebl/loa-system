name: Release Foundry System

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create system zip
        run: |
          zip -r loa-system.zip \
            system.json \
            template.json \
            scripts \
            templates \
            styles

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            loa-system.zip
            system.json